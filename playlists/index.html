---
# Front matter (even empty) tells GitHub Pages' Jekyll build to process this
# file, so the include below can list every audio file under /playlists/.
---
<!DOCTYPE html>
<html>
<head>
    <title>Discount Fireworks - Playlists</title>
    <meta name="viewport" content="user-scalable=0, initial-scale=1.0">
    <meta property="og:title" content="Discount Fireworks - Playlists">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://discountfireworks.band/playlists/">
    <meta property="og:image" content="https://discountfireworks.band/discount-fireworks.jpg">
    <link rel="stylesheet" href="/css.css">
</head>
<body>
<div class="container">
    <h2><a href="/">Discount Fireworks</a></h2>
    <hr>
    <div id="app"></div>
</div>

{% include playlist-player.html %}
<script>
function route() {
  var name = decodeURIComponent(location.hash.slice(1));
  // Old-style links (/playlists/#folder) go to the playlist's own page when it has one.
  if (name && PAGES[name]) { location.replace(PAGES[name].url); return; }
  if (name && lists[name] && lists[name].tracks.length) showList(lists[name]);
  else showIndex();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
