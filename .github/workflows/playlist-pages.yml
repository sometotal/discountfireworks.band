name: Playlist pages

# When a new folder lands in playlists/, add its index.html page so the
# playlist gets its own URL and title for link previews.
on:
  push:
    branches: [main]
    paths: ['playlists/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/playlist-pages.js
      - name: Commit new pages and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add playlists
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add pages for new playlists"
          git push
          # Make sure GitHub Pages picks up the bot's commit.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
