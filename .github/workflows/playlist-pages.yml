name: Playlist pages

# Rebuilds the playlist pages whenever something in playlists/ changes, so a
# new folder of mp3s gets its own page (and title for link previews).
on:
  push:
    branches: [main]
    paths: ['playlists/**', '.github/scripts/build-playlists.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/build-playlists.js
      - name: Commit updated pages and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A playlists
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update playlist pages"
          git push
          # Make sure GitHub Pages picks up the bot's commit.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
