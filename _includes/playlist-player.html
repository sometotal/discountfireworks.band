<style>
  .playlists a { display: block; font-size: 1.2em; margin: 14px 0; }
  .cover { max-width: 300px; width: 100%; margin: 10px auto; display: block; }
  audio { width: 100%; margin: 15px 0 5px; }
  .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
  .controls button { font-size: 1.1em; padding: 6px 16px; border: 2px solid #A00; background: #fff; color: #A00; border-radius: 6px; cursor: pointer; }
  .tracks { list-style: none; padding: 0; text-align: left; }
  .tracks li { padding: 10px 8px; border-bottom: 1px solid #ddd; cursor: pointer; display: flex; gap: 10px; }
  .tracks li:hover { background: #f6f6f6; }
  .tracks li.playing { background: #A00; color: #fff; font-weight: bold; }
  .tracks .num { opacity: 0.6; min-width: 1.5em; text-align: right; }
  .empty { text-align: center; opacity: 0.7; }
</style>
<script>
// Every file under /playlists/, generated at build time by Jekyll.
var FILES = [{% for f in site.static_files %}{% assign p = f.path | slice: 0, 11 %}{% if p == "/playlists/" %}{{ f.path | jsonify }},{% endif %}{% endfor %}];

// Playlist folders that have their own page (playlists/<folder>/index.html),
// so they get a real URL and a proper title in link previews.
var PAGES = {};
{% for pg in site.pages %}{% if pg.layout == "playlist" %}{% assign parts = pg.dir | split: "/" %}PAGES[{{ parts.last | jsonify }}] = { url: {{ pg.url | jsonify }}, title: {{ pg.title | default: parts.last | jsonify }} };
{% endif %}{% endfor %}

var AUDIO = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i;
var IMAGE = /\.(jpe?g|png|gif|webp)$/i;

// Group files by their folder directly inside /playlists/.
var lists = {};
FILES.forEach(function (path) {
  var parts = path.split('/'); // ["", "playlists", folder, ..., file]
  if (parts.length < 4) return;
  var name = parts[2];
  var l = lists[name] || (lists[name] = { name: name, tracks: [], images: [] });
  if (AUDIO.test(path)) l.tracks.push(path);
  else if (IMAGE.test(path)) l.images.push(path);
});
Object.keys(PAGES).forEach(function (n) { if (lists[n]) lists[n].title = PAGES[n].title; });
var names = Object.keys(lists).filter(function (n) { return lists[n].tracks.length; })
  .sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });

function url(path) { return path.split('/').map(encodeURIComponent).join('/'); }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function displayName(l) { return l.title || l.name; }
function title(path) {
  return path.split('/').pop()
    .replace(/\.[^.]+$/, '')          // extension
    .replace(/^\d+[\s._-]+/, '')      // leading track number
    .replace(/[_]+/g, ' ');
}
function cover(l) {
  var pick = l.images.filter(function (p) { return /\/(cover|folder|front)\.[^/]+$/i.test(p); })[0] || l.images[0];
  return pick ? '<img class="cover" src="' + url(pick) + '" alt="">' : '';
}

var app = document.getElementById('app');

function showIndex() {
  document.title = 'Discount Fireworks - Playlists';
  if (!names.length) {
    app.innerHTML = '<p class="empty">No playlists yet.</p>';
    return;
  }
  app.innerHTML = '<h3>Playlists</h3><div class="playlists">' + names.map(function (n) {
    var href = PAGES[n] ? PAGES[n].url : '#' + encodeURIComponent(n);
    return '<a href="' + esc(href) + '">' + esc(displayName(lists[n])) + '</a>';
  }).join('') + '</div>';
}

function showList(l) {
  var tracks = l.tracks.slice().sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
  var current = 0;
  document.title = displayName(l) + ' - Discount Fireworks';

  app.innerHTML =
    cover(l) +
    '<h3>' + esc(displayName(l)) + '</h3>' +
    '<audio id="player" controls preload="metadata" controlsList="nodownload noplaybackrate" oncontextmenu="return false"></audio>' +
    '<div class="controls"><button id="prev" aria-label="Previous track">&#9198;</button><button id="next" aria-label="Next track">&#9197;</button></div>' +
    '<ol class="tracks">' + tracks.map(function (t, i) {
      return '<li data-i="' + i + '"><span class="num">' + (i + 1) + '</span><span>' + esc(title(t)) + '</span></li>';
    }).join('') + '</ol>' +
    '<p><a href="/playlists/">&larr; All playlists</a></p>';

  var player = document.getElementById('player');
  var items = app.querySelectorAll('.tracks li');

  function load(i, play) {
    current = (i + tracks.length) % tracks.length;
    player.src = url(tracks[current]);
    items.forEach(function (li, j) { li.classList.toggle('playing', j === current); });
    if (play) player.play();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title(tracks[current]), artist: 'Discount Fireworks', album: displayName(l)
      });
    }
  }

  items.forEach(function (li) {
    li.addEventListener('click', function () { load(+li.dataset.i, true); });
  });
  document.getElementById('prev').onclick = function () { load(current - 1, true); };
  document.getElementById('next').onclick = function () { load(current + 1, true); };
  player.addEventListener('ended', function () {
    if (current < tracks.length - 1) load(current + 1, true);
  });
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('previoustrack', function () { load(current - 1, true); });
    navigator.mediaSession.setActionHandler('nexttrack', function () { load(current + 1, true); });
  }

  load(0, false);
}
</script>
